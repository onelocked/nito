[all_follow]
flake-parts = "flake-parts"
flake-utils = "flake-utils"
nixpkgs = "nixpkgs"
rust-overlay = "rust-overlay"
systems = "systems"
tack = "tack"

[omit_inputs]
names = ["flake-compat","pre-commit-hooks","treefmt-nix","home-manager","nix-darwin"]

[shorturls]
gh = "github:{path}"

[tack]
recomposable = true

[inputs.diffview-plus]
type = "fetch"
url = "gh:dlyongemallo/diffview-plus.nvim/ba05af7a295dcd8449bd03ebb3aead8268a5c379"

[inputs.nixpkgs]
url = "gh:nixos/nixpkgs/nixos-unstable"

[inputs.nixvim]
url = "gh:nix-community/nixvim"

[inputs.opencode-nvim]
type = "fetch"
url = "gh:nickjvandyke/opencode.nvim"

[inputs.tack]
group = "nix"
url = "gh:manic-systems/tack"

